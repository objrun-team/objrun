# docker compose -f examples/benchmark/cmt/compose.yaml up -d --build
#
# **Keep `127.0.0.1:`** in `127.0.0.1:7901:7901`. Without it, Docker publishes the port on every network interface and turns a local grading process into a service accessible throughout the LAN.
services:
  grader:
    build:
      context: .
      dockerfile: Dockerfile
    image: tgengin-cmt-grader
    ports:
      - "127.0.0.1:7901:7901"
    restart: unless-stopped
    # The grading service writes no files; its corpus and grader are inside the image.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
