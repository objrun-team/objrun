# docker compose -f examples/benchmark/cmt/compose.yaml up -d --build
#
# `127.0.0.1:7901:7901` 里的 `127.0.0.1:` **别去掉** —— 不写的话 Docker 会把这个口
# 发布到所有网卡上，判卷台就从「本机一个进程」变成「局域网里谁都能打」。
services:
  grader:
    build:
      context: .
      dockerfile: Dockerfile
    image: tgengin-cmt-grader
    ports:
      - "127.0.0.1:7901:7901"
    restart: unless-stopped
    # 判卷台不写任何文件，题库和判据在镜像里。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
