# H2H: a local SQLite service.
#
# **All configuration for this instance lives in this file**; there is no second set of editable defaults in code.
# Paths resolve relative to the directory containing this file (H2H/), not the process cwd.
# Resolving against cwd could silently open a different database when launched elsewhere,
# making the instance appear empty without reporting an error.
#
# Values may use ${VAR} to read environment variables; the root .env is loaded first.

server:
  host: 127.0.0.1
  port: 7801
  # Maximum request-body size, in bytes.
  bodyLimit: 1048576
  # Maximum wait for in-flight requests after Ctrl-C, in milliseconds.
  shutdownTimeout: 5000

log:
  # fatal | error | warn | info | debug | trace | silent
  level: info

db:
  # Database file. Create its directory if missing; otherwise SQLite reports
  # "unable to open database file", which does not identify the missing directory.
  file: ./data/h2h.sqlite
  # Sealed storage for objective G: **a separate database file that H2H does not open**. The main database exposes its full API,
  # so storing G there would remove the boundary. Direct access to G must be structurally impossible, not merely forbidden.
  sealed: ./data/sealed.sqlite

  # PRAGMAs executed in this order at startup.
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    foreign_keys: ON
    busy_timeout: 5000

api:
  # All API routes use this prefix.
  prefix: /api
  # Token. Empty disables authentication (the local default). To enable it, use ${H2H_TOKEN},
  # put the value in the root .env, and send Authorization: Bearer <token> from the client.
  token:
  # Allow raw SQL queries (POST /query) through a separate **read-only connection**.
  # Writes cannot succeed: this is enforced by the connection, not by recognizing SQL keywords.
  allowQuery: true
  # Allow writes (POST /exec and POST /tables/:table/rows). Enabled locally while listening on 127.0.0.1.
  # Before exposing server.host externally, disable writes or configure api.token.
  allowWrite: true
  # Maximum rows per response. Larger requested limits are capped at this value.
  maxRows: 500
  # Rows returned when a request does not specify limit.
  defaultLimit: 100

llm:
  # Maximum generated tokens per **model call**, not per execution unit: truncated calls can continue below.
  maxTokens: 16384
  # Maximum retries after a failed call. 0 disables retries.
  #
  # This differs from SDK retries, which handle HTTP failures (connection errors, 5xx, 429),
  # but not an unreadable successful response (`Failed to process successful response`).
  # The kernel intentionally does not retry such a failed unit: waking it would create a hot loop.
  # It must then wait for expect_ms, allowing one transient failure to consume 15 minutes.
  #
  # Each retry adds a 5-second delay (5 / 10 / 15...); transient failures often resolve while waiting.
  retryTimes: 3
  # Maximum continuations after truncation. 0 disables continuation.
  #
  # Reasoning models share their output budget between **reasoning and visible text**.
  # One large budget can be spent entirely on reasoning, leaving no visible answer (12 of 19 observed responses were empty,
  # so three tasks received no answer). Instead, allocate smaller calls and continue unfinished output.
  # No answer and an unfinished answer differ: the former should fail; the latter should be allowed to finish.
  continueTimes: 3
  # Reasoning effort. **Pass this value to the provider unchanged**; support is the provider's responsibility.
  #
  # These seven supported values were obtained by sending an invalid value; the endpoint lists valid choices:
  #
  #     none · minimal · low · medium · high · xhigh · max
  #
  # Observed for `deepseek-v4-flash` on the same physics problem: `none` took 14.5 seconds without reasoning; `minimal`
  # took 113 seconds and 10,653 reasoning tokens; `low` took 124 seconds and 12,057. **`minimal` differs from `low` by only
  # about 10%; it is not a substantial cost reduction. `none` is the sharp reduction.**
  #
  # **Incompatible with `cycle.must_call`**: while reasoning is enabled, forced `tool_choice` values return HTTP 400
  # (`Thinking mode does not support this tool_choice`), for both named tools and `required`.
  # Only `auto` is accepted. The adapter handles this: a unit with a required tool, such as submission,
  # sets reasoning to `none` before sending. The global setting need not accommodate those units.
  #
  # An agent can override this setting through `agent.knobs`: an agent that retrieves information
  # and explains its findings may not need reasoning, while the solver it serves may benefit from as much reasoning as possible.
  reasoningEffort: medium
  # Sampling temperature. **0 for a benchmark**: without it there is no telling how
  # much of a score change came from an edit and how much from sampling noise.
  temperature: 0
  # Sampling seed. Only some vendors honour it; harmless where they do not.
  seed: 42

cors:
  enabled: true
  # "*" or a list of origins, such as ["http://127.0.0.1:5173"]
  origin: "*"
