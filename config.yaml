# H2H —— 一台本地 SQLite 服务。
#
# **这台机器的全部配置都在这一个文件里**，代码里不留第二处默认值可改。
# 路径一律相对这个文件所在的目录（H2H/），不是相对进程的 cwd ——
# 相对 cwd 的话，从别的地方启动就会去开另一个库，而它不报错，
# 只是那台机器看起来「什么都没有」。
#
# 值里可以写 ${VAR}，从环境变量取（仓库根的 .env 会先装进来）。

server:
  host: 127.0.0.1
  port: 7801
  # 请求体上限，字节。
  bodyLimit: 1048576
  # 收到 Ctrl-C 之后，最多等在途请求多久（毫秒）。
  shutdownTimeout: 5000

log:
  # fatal | error | warn | info | debug | trace | silent
  level: info

db:
  # 库文件。目录不在就建 —— 不建的话 SQLite 报的是
  # 「unable to open database file」，那句话看不出是目录缺了。
  file: ./data/h2h.sqlite
  # 验证函数 G 的封存区。**单独一个库文件，H2H 不开它** —— 主库是全接口开放的，
  # G 存主库等于没有墙。红线是「不许直接读到 G 的定义」，靠的是够不着，不是规定不许。
  sealed: ./data/sealed.sqlite

  # 开机按顺序执行的 PRAGMA。
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    foreign_keys: ON
    busy_timeout: 5000

api:
  # 所有接口挂在这个前缀下。
  prefix: /api
  # 令牌。留空 = 不校验（本地默认）。要校验就写 ${H2H_TOKEN}，
  # 值放进仓库根的 .env，客户端发 Authorization: Bearer <token>。
  token:
  # 允许发原始 SQL 查（POST /query）。走一条独立的**只读连接**，
  # 写不进去 —— 这是连接层面的保证，不是靠认关键字。
  allowQuery: true
  # 允许写（POST /exec、POST /tables/:table/rows）。只听 127.0.0.1，本地开着；
  # 要是把 server.host 改成对外的地址，先把这条关掉，或者配上 api.token。
  allowWrite: true
  # 一次最多返回多少行。请求要更多也按这个截。
  maxRows: 500
  # 请求没带 limit 时返回多少行。
  defaultLimit: 100

llm:
  # **一次调用**最多生成多少 token。不是一个执行单元的上限 —— 截断了会续写，见下。
  maxTokens: 16384
  # 一次调用炸了之后最多重打几次。0 = 不重打。
  #
  # 跟 SDK 自己那层重试不是一回事：它管的是 HTTP 层（连不上、5xx、429），管不了
  # 「200 回来了但读不懂」那种（`Failed to process successful response`）。而炸在那儿
  # 之后内核按设计不重试（醒了就是原地热循环），那一站只能挂着等 expect_ms ——
  # 一次偶发抖动烧掉 15 分钟。
  #
  # 每重打一次多等 5 秒（5 / 10 / 15…）：抖动多半自己会过去，等一等比立刻再打有用。
  retryTimes: 3
  # 截断之后最多再续几次。0 = 不续。
  #
  # 为什么要这一档：思考型模型的输出预算是**思考和可见文本共用**的，一刀切的大额度
  # 只会让它把预算全花在思考上，最后可见文本是空的（实测 19 条答复里 12 条全空，
  # 三道题因此一个字都没答）。改成「每次少给一点，没说完就接着说」——
  # 模型「没答」和「没答完」是两回事，前者该判错，后者该给它说完。
  continueTimes: 3
  # 思考强度。**原样发给那家** —— 认不认得是那家的事，我们不替它猜；不认得这个
  # 参数的模型会忽略它。
  #
  # DeepSeek 那边实际只有三档：`max` / `high` / `none`。**`low` 和 `medium` 是假的**,
  # 服务端直接映射成 `high`，填了跟没填一样 —— 所以「调低一点」这件事只有一个选择，
  # 就是彻底关掉。
  reasoningEffort: none
  # Sampling temperature. **0 for a benchmark**: without it there is no telling how
  # much of a score change came from an edit and how much from sampling noise.
  temperature: 0
  # Sampling seed. Only some vendors honour it; harmless where they do not.
  seed: 42

cors:
  enabled: true
  # "*" 或者一串来源，如 ["http://127.0.0.1:5173"]
  origin: "*"
